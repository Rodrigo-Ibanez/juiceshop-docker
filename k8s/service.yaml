apiVersion: v1
kind: Service
metadata:
  name: juice-shop
  namespace: juiceshop
  labels:
    app: juice-shop
spec:
  # NodePort permite que o Nginx, na rede Docker kind,
  # alcance a aplicação através do node do cluster.
  # A porta não será publicada diretamente no Windows.
  type: NodePort

  selector:
    app: juice-shop

  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30080
      protocol: TCP
