apiVersion: v1
kind: Service
metadata:
  name: juice-shop
  namespace: juiceshop
  labels:
    app: juice-shop
spec:
  # Serviço interno do cluster; não publica NodePort.
  type: ClusterIP

  # Encaminha para os Pods que possuem esta label.
  selector:
    app: juice-shop

  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
