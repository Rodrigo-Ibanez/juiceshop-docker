apiVersion: v1
kind: Service
metadata:
  name: juice-shop
  namespace: juiceshop
  labels:
    app: juice-shop

spec:
  # O tráfego chega ao Nginx sidecar na porta 3001.
  # O sidecar encaminha as requisições para o Juice Shop na porta 3000.
  # O NodePort não será publicado diretamente no Windows.
  type: NodePort

  selector:
    app: juice-shop

  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30080
      protocol: TCP