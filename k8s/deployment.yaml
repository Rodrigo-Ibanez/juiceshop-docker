apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: juiceshop
  labels:
    app: juice-shop

spec:
  replicas: 2

  selector:
    matchLabels:
      app: juice-shop

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: juice-shop

    spec:
      containers:
        - name: juice-shop
          image: bkimminich/juice-shop:v20.3.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: app-http
              containerPort: 3000
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /
              port: app-http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /
              port: app-http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"

        - name: pentest-logger
          image: nginx:1.28-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3001
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /_sidecar-health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /_sidecar-health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

          volumeMounts:
            - name: pentest-logger-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

      volumes:
        - name: pentest-logger-config
          configMap:
            name: pentest-logger