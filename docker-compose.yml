services:
  juice-shop:
    image: bkimminich/juice-shop:v20.3.0
    container_name: juice-shop
    ports:
      - "127.0.0.1:3000:3000"
    restart: always
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
