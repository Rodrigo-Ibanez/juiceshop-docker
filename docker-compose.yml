services:
  juice-shop:
    image: bkimminich/juice-shop:v20.3.0
    container_name: juice-shop
    restart: always
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - juice-internal

  nginx:
    image: nginx:1.28-alpine
    container_name: juice-shop-nginx
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      juice-shop:
        condition: service_healthy
    networks:
      - juice-internal

networks:
  juice-internal:
    driver: bridge
