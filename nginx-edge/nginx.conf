worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=juice_limit:10m rate=5r/s;
    limit_req_status 429;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name juiceshop.local;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name juiceshop.local;

        ssl_certificate     /etc/nginx/certs/juiceshop.local.crt;
        ssl_certificate_key /etc/nginx/certs/juiceshop.local.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            limit_req zone=juice_limit burst=10 nodelay;

            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;

            proxy_pass http://juiceshop-local-control-plane:30080;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
