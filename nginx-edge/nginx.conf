worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format pentest '$time_iso8601 '
                       'client=$remote_addr '
                       'method=$request_method '
                       'uri="$request_uri" '
                       'status=$status '
                       'upstream=$upstream_addr '
                       'upstream_status=$upstream_status '
                       'pentest_id="$http_x_pentest_id"';

    access_log /var/log/nginx/access.log pentest;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name juiceshop.local;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name juiceshop.local;

        ssl_certificate /etc/nginx/certs/juiceshop.local.crt;
        ssl_certificate_key /etc/nginx/certs/juiceshop.local.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;

            proxy_pass http://juiceshop-local-control-plane:30080;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}